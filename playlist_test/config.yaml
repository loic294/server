name: Music Assistant - Playlist Test
version: 2.11.0.dev1
slug: music_assistant_playlist_test
description: Unofficial test server with podcast and audiobook playlist playback settings.
url: https://github.com/loic294/server/tree/playlist-playback-test
arch:
  - amd64
  - aarch64
homeassistant_api: true
hassio_api: true
hassio_role: manager
discovery:
  - music_assistant
auth_api: true
host_network: true
ingress: true
ingress_port: 8094
audio: true
panel_icon: mdi:music-assistant
panel_title: MA Playlist Test
panel_admin: false
apparmor: true
map:
  - media:rw
  - ssl:ro
init: false
backup_exclude:
  - cache.db
  - collage_images/*
  - .cache/*
  - library.db.backup
stage: experimental
image: ghcr.io/loic294/music-assistant-playlist-test
tmpfs: true
options:
  log_level: info
  safe_mode: false
schema:
  log_level: list(debug|info|warning|error)
  safe_mode: bool
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
