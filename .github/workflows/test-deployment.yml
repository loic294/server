name: Playlist test deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playlist-test-deployment
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/loic294/music-assistant-playlist-test
  BASE_IMAGE_VERSION: "1.7.0"

jobs:
  wheels:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      wheel_sha256: ${{ steps.version.outputs.wheel_sha256 }}
      frontend_sha: ${{ steps.frontend.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read pinned frontend source
        id: frontend
        run: |
          sha=$(cat .github/test-frontend-sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: loic294/frontend
          ref: ${{ steps.frontend.outputs.sha }}
          path: frontend
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Prepare matching package versions
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$RUN_ATTEMPT" -lt 1000
          version="2.11.0.dev$((RUN_NUMBER * 1000 + RUN_ATTEMPT))"
          echo "TEST_VERSION=$version" >> "$GITHUB_ENV"
          python scripts/prepare_test_release.py --version "$version" --frontend-dir frontend
          python -m pip install build
      - name: Test and build custom frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test:run
          pnpm lint:check
          pnpm build
          python -m build
          .github/scripts/verify-python-package.sh
      - name: Build server wheel without official-only provider credentials
        run: |
          test ! -f music_assistant/helpers/app_secrets.json
          python -m build --wheel
          cp frontend/dist/*.whl dist/
      - name: Record wheel identity
        id: version
        run: |
          echo "version=$TEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "wheel_sha256=$(sha256sum "dist/music_assistant-${TEST_VERSION}-py3-none-any.whl" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: test-wheels
          path: |
            dist/*.whl
            requirements_all.txt
          retention-days: 30

  image:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: test-wheels
          path: release
      - name: Restore image inputs
        run: |
          mkdir -p dist
          cp release/dist/*.whl dist/
          cp release/requirements_all.txt requirements_all.txt
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE }}:${{ needs.wheels.outputs.version }}-${{ matrix.arch }}
          build-args: |
            MASS_VERSION=${{ needs.wheels.outputs.version }}
            MASS_REVISION=${{ github.sha }}
            MASS_WHEEL_SHA256=${{ needs.wheels.outputs.wheel_sha256 }}
            BASE_IMAGE_VERSION=${{ env.BASE_IMAGE_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/loic294/server
            org.opencontainers.image.revision=${{ github.sha }}
            io.music-assistant.frontend.revision=${{ needs.wheels.outputs.frontend_sha }}
          cache-from: type=gha,scope=playlist-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=playlist-${{ matrix.arch }}
      - name: Verify installed packages and frontend assets
        env:
          VERSION: ${{ needs.wheels.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --entrypoint python "$IMAGE:$VERSION-$ARCH" -c \
            "import importlib.metadata as m; from pathlib import Path; from music_assistant_frontend import where; assert m.version('music-assistant') == '$VERSION'; assert m.version('music-assistant-frontend') == '$VERSION'; assert (Path(where()) / 'index.html').is_file(); assert list((Path(where()) / 'assets').glob('*.js')); from music_assistant.controllers.music.media.playlists import PlaylistController"
      - name: Verify server startup and HTTP readiness
        env:
          VERSION: ${{ needs.wheels.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          name="playlist-test-$ARCH"
          docker run --detach --name "$name" -p 18095:8095 "$IMAGE:$VERSION-$ARCH"
          ready=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18095/info > server-info.json; then
              ready=true
              break
            fi
            sleep 2
          done
          docker logs "$name"
          docker rm --force "$name"
          test "$ready" = true
          python3 -c "import json; data=json.load(open('server-info.json')); assert data['server_version'] == '$VERSION', data"
      - name: Push verified architecture
        env:
          VERSION: ${{ needs.wheels.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker push "$IMAGE:$VERSION-$ARCH"

  publish:
    needs: [wheels, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      - name: Publish multi-architecture version
        env:
          VERSION: ${{ needs.wheels.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:playlist-test" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - name: Offer the verified image to Home Assistant
        env:
          VERSION: ${{ needs.wheels.outputs.version }}
        run: |
          sed -i "s/^version: .*/version: $VERSION/" playlist_test/config.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist_test/config.yaml
          git commit -m "Publish playlist test app $VERSION [skip ci]"
          git pull --rebase origin playlist-playback-test
          git push origin HEAD:playlist-playback-test
          echo "### Test image: \`$IMAGE:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Home Assistant repository: https://github.com/loic294/server" >> "$GITHUB_STEP_SUMMARY"
